<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAPC - Configuración</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#eef1f5;margin:0;padding:16px;color:#222}
.c{max-width:400px;margin:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px #0002}
h1{font-size:1.3em;margin:0 0 4px}
.s{color:#666;margin:0 0 14px;font-size:.92em}
label{display:block;font-weight:600;margin:14px 0 5px}
input[type=text],input[type=password],input[type=number]{width:100%;box-sizing:border-box;padding:11px;font-size:1em;border:1px solid #bbb;border-radius:8px}
button{width:100%;padding:12px;font-size:1em;border:0;border-radius:8px;background:#1565c0;color:#fff;margin-top:18px}
button:disabled{background:#9aa5b1}
.f{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.92em}
#lista{border:1px solid #ddd;border-radius:8px;max-height:220px;overflow-y:auto}
.red{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer}
.red:last-child{border-bottom:0}
.red:hover,.red.sel{background:#e8f0fe}
.red span{color:#777;font-size:.85em;white-space:nowrap;margin-left:8px}
h2{font-size:1.05em;margin:22px 0 0;padding-top:14px;border-top:1px solid #e3e3e3}
.ay{color:#777;font-size:.85em;margin:5px 0 0}
.fila{display:flex;gap:10px}.fila>div:first-child{flex:1}.fila>div:last-child{width:100px}
.vacio{padding:10px 12px;color:#777;font-size:.9em}
.lnk{background:none;color:#1565c0;padding:6px 0 0;margin:0;width:auto;font-size:.9em}
#est{margin-top:16px;padding:12px;border-radius:8px;display:none;font-size:.95em}
.ok{background:#e3f6e8;color:#1b5e20}.er{background:#fdecea;color:#b71c1c}.pr{background:#e8f0fe;color:#0d47a1}
</style>
</head>
<body>
<div class="c">
  <h1>Configurar conexión</h1>
  <p class="s">Elegí la red a la que se va a conectar la manta sensora y el equipo donde corre el broker MQTT.</p>

  <label>Redes disponibles</label>
  <div id="lista"><div class="vacio">Buscando redes...</div></div>
  <button type="button" class="lnk" id="bus">Buscar de nuevo</button>

  <form id="fm">
    <label for="ssid">Nombre de la red (SSID)</label>
    <input type="text" id="ssid" name="ssid" maxlength="32" required autocomplete="off" autocapitalize="off">
    <label for="pass">Contraseña</label>
    <input type="password" id="pass" name="pass" maxlength="64" autocomplete="off">
    <div class="f"><input type="checkbox" id="ver"><span>Mostrar contraseña</span></div>

    <h2>Servidor MQTT (broker)</h2>
    <div class="fila">
      <div>
        <label for="broker">IP del equipo</label>
        <input type="text" id="broker" name="broker" maxlength="63" required placeholder="192.168.1.5"
               autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div>
        <label for="puerto">Puerto</label>
        <input type="number" id="puerto" name="puerto" min="1" max="65535" value="1883" required>
      </div>
    </div>
    <p class="ay">IP de la PC donde corre Mosquitto, en la misma red Wi-Fi
      (en Windows: <code>ipconfig</code>, en Linux: <code>ip a</code>).</p>
    <button id="bt">Guardar y conectar</button>
  </form>
  <div id="est"></div>
</div>
<script>
const $ = id => document.getElementById(id);
function est(t, c) { const e = $('est'); e.style.display = 'block'; e.className = c; e.textContent = t; }
function senal(r) { return r > -55 ? '▂▄▆█' : r > -67 ? '▂▄▆' : r > -78 ? '▂▄' : '▂'; }

async function buscar() {
  $('bus').disabled = true; $('bus').textContent = 'Buscando...';
  try {
    const r = await (await fetch('/scan')).json();
    r.sort((a, b) => b.r - a.r);
    const l = $('lista'); l.innerHTML = '';
    if (!r.length) l.innerHTML = '<div class="vacio">No se encontraron redes. Probá de nuevo o escribí el nombre.</div>';
    for (const x of r) {
      const d = document.createElement('div'); d.className = 'red';
      d.textContent = (x.a ? '🔒 ' : '') + x.s;
      const s = document.createElement('span'); s.textContent = senal(x.r); d.appendChild(s);
      d.onclick = () => {
        document.querySelectorAll('.red').forEach(e => e.classList.remove('sel'));
        d.classList.add('sel'); $('ssid').value = x.s; $('pass').value = '';
        if (x.a) $('pass').focus();
      };
      l.appendChild(d);
    }
  } catch (e) {
    $('lista').innerHTML = '<div class="vacio">No se pudo buscar. Probá de nuevo.</div>';
  }
  $('bus').disabled = false; $('bus').textContent = 'Buscar de nuevo';
}

$('bus').onclick = buscar;
$('ver').onchange = e => $('pass').type = e.target.checked ? 'text' : 'password';

$('fm').onsubmit = async e => {
  e.preventDefault();
  const p = $('pass').value;
  if (p.length > 0 && p.length < 8) { est('La contraseña debe tener al menos 8 caracteres.', 'er'); return; }
  if (!$('broker').value.trim()) { est('Falta la IP del broker MQTT.', 'er'); return; }
  $('bt').disabled = true; est('Enviando...', 'pr');
  try {
    const r = await (await fetch('/guardar', { method: 'POST', body: new URLSearchParams(new FormData($('fm'))) })).json();
    if (!r.ok) { est(r.m, 'er'); $('bt').disabled = false; return; }
    est(r.m, 'pr');
  } catch (e) { est('Error de comunicación con el equipo.', 'er'); $('bt').disabled = false; return; }
  setTimeout(consultar, 1000);
};

let fallos = 0;
async function consultar() {
  try {
    const r = await (await fetch('/estado')).json();
    fallos = 0;
    if (r.e === 'probando') { est(r.m, 'pr'); setTimeout(consultar, 1000); return; }
    if (r.e === 'ok') { est('✔ ' + r.m, 'ok'); return; }
    if (r.e === 'error') { est(r.m, 'er'); $('bt').disabled = false; return; }
  } catch (e) {
    // Al conectarse, la ESP puede cambiar de canal y cortar un momento esta red.
    if (++fallos > 3) {
      est('Se perdió la conexión con el equipo. Si los datos eran correctos, ya se conectó y cerró esta red. ' +
          'Si la red "SAPC-Config" sigue apareciendo, volvé a conectarte y probá de nuevo.', 'pr');
    }
  }
  setTimeout(consultar, 1500);
}

// Precarga lo que ya estaba guardado (la contraseña nunca se envía)
async function cargarConfig() {
  try {
    const c = await (await fetch('/config')).json();
    if (c.s && !$('ssid').value) $('ssid').value = c.s;
    if (c.b && !$('broker').value) $('broker').value = c.b;
    if (c.p) $('puerto').value = c.p;
  } catch (e) {}
}

cargarConfig().then(buscar);
</script>
</body>
</html>
